name: CI

# Runs on every pull request into dev or main, and again after the merge
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compiles the project and runs every test. A red X here blocks the merge.
      - name: Build and test
        run: ./mvnw -B verify
