# Used only when SPRING_PROFILES_ACTIVE=prod (the Dockerfile sets this).
# The three values come from environment variables you set on the host. Never commit real ones.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

# The H2 console must never be reachable on a public server
spring.h2.console.enabled=false

# Render tells the app which port to listen on
server.port=${PORT:8080}