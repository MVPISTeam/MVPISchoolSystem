spring.application.name=sms

# ---- Database: H2 saved to a file in ./data, so your data survives a restart ----
spring.datasource.url=jdbc:h2:file:./data/smsdb 
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates and updates the tables from our @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Browser view of the database at http://localhost:8080/h2-console (development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
