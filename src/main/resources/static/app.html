<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff portal · Mountain View Primary and Infant School</title>
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
  <div class="portal">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard" id="brand">
        <span class="name">Mountain View<small>Staff portal</small></span>
      </a>
      <nav class="side-nav" id="nav" aria-label="Portal"></nav>
      <div class="side-foot"><a href="/">← School website</a></div>
    </aside>

    <div>
      <header class="topbar">
        <button class="btn btn-ghost btn-sm menu-toggle" type="button" id="menu-toggle" aria-controls="sidebar" aria-expanded="false">Menu</button>
        <h1 id="page-title"></h1>
        <div class="spacer"></div>
        <div class="user-chip">
          <div class="avatar" id="avatar"></div>
          <div class="who"><strong id="user-name"></strong><span id="user-role"></span></div>
        </div>
        <button class="btn btn-ghost btn-sm" type="button" id="logout">Log out</button>
      </header>
      <main class="content" id="main" tabindex="-1"></main>
    </div>
  </div>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
