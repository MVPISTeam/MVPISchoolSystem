<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal - Home</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/common.js"></script>
    <script src="../js/dashboard.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1>MVPI Staff Portal</h1>
            <nav>
                <ul id="nav"></ul>
            </nav>
        </div>
    </header>

    <main class="portal container">
        <p class="user-info" id="user-info"></p>
        <div id="page-content">
            <h2 id="welcome">Welcome!</h2>
            <p>Use the menu at the top to get to the parts of the portal you can use.</p>

            <h3>Today at a glance</h3>
            <div class="boxes" id="boxes"></div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>Copyright 2026, Mountain View Primary and Infant School</p>
        </div>
    </footer>
</body>
</html>
